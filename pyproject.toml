[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-stock-picker"
version = "0.1.0"
description = "Quantitative stock picker with Walk-forward optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30",
    "tickflow[all]>=0.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "streamlit-authenticator>=0.4.2",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quant-picker-init = "quant_picker.cli.init_deployment:main"
quant-picker-scheduler = "quant_picker.scheduler.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
